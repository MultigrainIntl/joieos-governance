name: JoieOS Compliance

# The governance repository tests ITSELF against the rules in THIS commit, not against the
# version published on main. Referencing main here created a trap: a change that fixes the
# rules could never pass, because it was judged by the rules it was fixing.
on: [push, pull_request, workflow_dispatch]

jobs:
  compliance:
    uses: ./.github/workflows/compliance.yml
