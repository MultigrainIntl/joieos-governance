name: JoieOS Conformance Scan

# Finds every MultigrainIntl repository — including ones created since the last run —
# and reports which are not yet under JoieOS governance.
#
# Read-only. Changes nothing. Opens an issue here when something is out of conformance,
# so a new repository cannot quietly sit outside the rules.
#
# REQUIRES a secret named JOIEOS_SCAN_TOKEN: a fine-grained personal access token with
# read-only "Contents", "Metadata" and "Administration" access to all repositories.
# Without it the scan sees only public repos and says so.

on:
  schedule:
    - cron: "0 14 * * 1"   # Mondays 14:00 UTC = 8:00am America/Denver
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    name: Conformance scan
    runs-on: ubuntu-latest
    steps:
      - name: Scan all repositories
        id: scan
        env:
          GH_TOKEN: ${{ secrets.JOIEOS_SCAN_TOKEN || github.token }}
          SCOPED: ${{ secrets.JOIEOS_SCAN_TOKEN != '' }}
        run: |
          set -u
          OWNER=MultigrainIntl
          if [ "$SCOPED" != "true" ]; then
            echo "WARNING: JOIEOS_SCAN_TOKEN not set — private repositories cannot be seen." | tee -a report.md
            echo "" >> report.md
          fi

          REPOS=$(gh repo list "$OWNER" --limit 200 --json name,isArchived \
                    --jq '.[] | select(.isArchived|not) | .name' 2>/dev/null | sort)

          echo "| Repository | Governance file | Compliance gate | Branch protection |" >> report.md
          echo "|---|---|---|---|" >> report.md

          BAD=0
          for r in $REPOS; do
            if gh api "repos/$OWNER/$r/contents/CLAUDE.md" -H "Accept: application/vnd.github.raw" 2>/dev/null | grep -qi joieos
              then C="yes"; else C="**MISSING**"; fi
            if gh api "repos/$OWNER/$r/contents/.github/workflows/joieos-compliance.yml" >/dev/null 2>&1
              then G="yes"; else G="**MISSING**"; fi
            N=$(gh api "repos/$OWNER/$r/rulesets" --jq 'length' 2>/dev/null || echo 0)
            if [ "${N:-0}" -gt 0 ] 2>/dev/null; then P="yes"; else P="**MISSING**"; fi
            echo "| $r | $C | $G | $P |" >> report.md
            case "$C$G$P" in *MISSING*) BAD=$((BAD+1)) ;; esac
          done

          echo "" >> report.md
          echo "$BAD repositories are not fully under JoieOS governance." >> report.md
          echo "bad=$BAD" >> "$GITHUB_OUTPUT"
          cat report.md

      - name: Open an issue when something is out of conformance
        if: steps.scan.outputs.bad != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "JoieOS conformance: ${{ steps.scan.outputs.bad }} repositories outside governance" \
            --body-file report.md
