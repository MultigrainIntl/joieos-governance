name: JoieOS Conformance

# Brings every MultigrainIntl repository — existing and newly created — under the JoieOS
# rules, and repairs any that have drifted out. Runs daily.
#
# It does not write GAJ a to-do list. It repairs what it can and records what it did.
#
# Repairs by itself (strengthening only, never weakening):
#   missing branch protection  -> applies deletion + force-push blocking
#   missing governance file    -> adds it
#   missing compliance gate    -> adds it
# For repositories whose live branch requires review it prepares a pull request and stops.
# It never approves its own work.
#
# Requires a secret JOIEOS_SCAN_TOKEN: a fine-grained personal access token with read+write
# Contents, Workflows, Administration and Pull requests on all repositories. Without it the
# job halts loudly rather than reporting a false all-clear.

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  conformance:
    name: JoieOS Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require the access key
        env:
          T: ${{ secrets.JOIEOS_SCAN_TOKEN }}
        run: |
          if [ -z "$T" ]; then
            echo "HALTED: JOIEOS_SCAN_TOKEN is not set."
            echo "Without it this job sees only public repositories and would report a false"
            echo "all-clear across most of the estate. Refusing to run half blind."
            exit 1
          fi
          echo "OK  access key present"

      - name: Repair conformance across all repositories
        id: run
        env:
          GH_TOKEN: ${{ secrets.JOIEOS_SCAN_TOKEN }}
        run: bash templates/conformance.sh

      - name: Record what was done
        if: steps.run.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "JoieOS conformance — $(date -u '+%Y-%m-%d')" \
            --body-file report.md
